<text x="82" y="588" fill="#e1eeee" font-family="Arial,sans-serif" font-size="15">SQLite · local file-backed database</text>
<text x="82" y="611" fill="#91a9b5" font-family="Arial,sans-serif" font-size="11">Used for local development and automated tests; not durable Vercel production storage.</text>
<rect x="55" y="649" width="1090" height="84" rx="13" fill="#2b2119" stroke="#a67b45"/>
<circle cx="83" cy="681" r="6" fill="#f1bd69"/>
<text x="102" y="684" fill="#f2cc91" font-family="Arial,sans-serif" font-size="12" font-weight="700">CURRENT PRODUCTION GATE · STORAGE UNCONFIGURED</text>
<text x="82" y="710" fill="#e2d1b6" font-family="Arial,sans-serif" font-size="12">Live /health currently reports storage: unconfigured. Configure DATABASE_URL + JWT_SECRET_KEY and run the PostgreSQL migration before enabling accounts, saved records or admin operations.</text>
<text x="57" y="755" fill="#587384" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">ARCHITECTURE SEPARATES IMPLEMENTED CODE, LOCAL DEVELOPMENT, AND PRODUCTION READINESS</text>
