<rect x="716" y="125" width="205" height="98" rx="11" fill="#172b3a" stroke="#4c8190"/><text x="737" y="157" fill="#91d4d2" font-size="11" font-weight="700">ANALYSIS ENGINE</text><text x="737" y="181" fill="#e0eded" font-size="13">Explainable baseline</text><text x="737" y="201" fill="#849eaa" font-size="9">Review-priority signals only</text>
