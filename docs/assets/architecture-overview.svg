<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t d">
<title id="t">DRISHTI target architecture and production configuration status</title>
<desc id="d">User PWA and Superadmin console call FastAPI authentication and role checks. FastAPI routes to a rule-based analyzer, case and evidence workflow, alerts and SOS, and a public IOC registry. PostgreSQL is the persistent production target; SQLite is for local development. The current production deployment reports storage unconfigured until DATABASE_URL is added.</desc>
