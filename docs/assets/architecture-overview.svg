<title id="t">DRISHTI architecture overview</title><desc id="d">User and superadmin interfaces connect to FastAPI role-based API, rule-based analysis, case management, threat intelligence and PostgreSQL storage.</desc>
<rect width="1200" height="720" rx="24" fill="#08111c"/><text x="55" y="65" fill="#edf6f6" font-family="Space Grotesk,Arial" font-size="31" font-weight="600">DRISHTI / SYSTEM ARCHITECTURE</text><text x="57" y="91" fill="#7fa0ad" font-family="Arial" font-size="12">Role-based · evidence-led · privacy-scoped · deployable on Vercel</text>
<g font-family="Arial">
<rect x="55" y="143" width="235" height="112" rx="12" fill="#102b39" stroke="#4f8f8b"/><text x="78" y="176" fill="#72dfcf" font-size="12" font-weight="700">USER PWA</text><text x="78" y="201" fill="#d9e8e9" font-size="14">Responsive workspace</text><text x="78" y="222" fill="#8fa9b4" font-size="10">Claim · History · Cases · SOS</text>
