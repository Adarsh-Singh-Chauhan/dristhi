<rect x="55" y="520" width="1090" height="125" rx="13" fill="#0f202d" stroke="#284555"/><text x="82" y="555" fill="#68daca" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.5">TRUST BOUNDARIES</text><text x="82" y="586" fill="#dbe8e9" font-family="Arial" font-size="13">User-owned records are isolated by account ownership. Superadmin routes require a server-verified role.</text><text x="82" y="612" fill="#91a9b5" font-family="Arial" font-size="11">No covert device tracking · no direct accusation from a score · no automated police / platform reporting.</text><text x="56" y="684" fill="#587384" font-family="Arial" font-size="10" letter-spacing="1.4">ARCHITECTURE OVERVIEW · CASE RECORDS &amp; ACCOUNT FEATURES REQUIRE PERSISTENT DATABASE CONFIGURATION</text>
</svg>