<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">DRISHTI user workspace screen concept</title><desc id="d">Illustrative interface showing claim input, platform selection, review priority and evidence-first case creation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1724"/><stop offset="1" stop-color="#101f2d"/></linearGradient><linearGradient id="mint"><stop stop-color="#42bba9"/><stop offset="1" stop-color="#8be0ce"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter></defs>
<rect width="1200" height="760" rx="28" fill="#070e18"/><rect x="30" y="28" width="1140" height="704" rx="20" fill="url(#bg)" stroke="#254252"/>
<rect x="30" y="28" width="1140" height="78" rx="20" fill="#0d1926"/><path d="M30 105H1170" stroke="#254252"/>
<rect x="57" y="47" width="38" height="38" rx="11" fill="#153d44" stroke="#3b9e91"/><circle cx="76" cy="66" r="10" fill="none" stroke="#72dfce" stroke-width="2"/><path d="M68 67h16" stroke="#72dfce" stroke-width="2"/>
<text x="110" y="64" fill="#f0f7f8" font-family="Space Grotesk,Arial" font-size="21" font-weight="700" letter-spacing="4">DRISHTI</text><text x="111" y="82" fill="#7895a3" font-family="Arial" font-size="9" letter-spacing="2">INFORMATION INTEGRITY WORKSPACE</text>
<rect x="895" y="51" width="116" height="30" rx="7" fill="#132b37" stroke="#31505d"/><text x="953" y="70" fill="#9bc7c1" font-family="Arial" font-size="10" text-anchor="middle">MY CASE FILES</text><rect x="1024" y="51" width="117" height="30" rx="7" fill="#65d7c6"/><text x="1082" y="70" fill="#071816" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle">SIGN IN</text>
<text x="68" y="153" fill="#77d9ca" font-family="Arial" font-size="10" letter-spacing="2">CLAIM REVIEW / 01</text><text x="68" y="193" fill="#edf5f6" font-family="Space Grotesk,Arial" font-size="37" font-weight="600">Pause. Verify. Then share.</text><text x="68" y="222" fill="#9cb0ba" font-family="Arial" font-size="14">Check the source and context before a claim travels further.</text>
<rect x="68" y="252" width="510" height="265" rx="14" fill="#111f2d" stroke="#294555"/><text x="94" y="285" fill="#8db0b9" font-family="Arial" font-size="10" letter-spacing="1.5">01 · MESSAGE DETAILS</text><text x="94" y="321" fill="#eaf3f3" font-family="Arial" font-size="15" font-weight="700">Message or public claim</text>
<rect x="94" y="338" width="458" height="103" rx="8" fill="#0a1521" stroke="#355264"/><text x="112" y="366" fill="#a7bac2" font-family="Arial" font-size="12">URGENT: An official announcement says this</text><text x="112" y="388" fill="#a7bac2" font-family="Arial" font-size="12">service will be shut down tomorrow. Forward</text><text x="112" y="410" fill="#a7bac2" font-family="Arial" font-size="12">this to everyone before it is too late!!!</text>
<text x="94" y="471" fill="#849aa7" font-family="Arial" font-size="10">PLATFORM</text><rect x="94" y="482" width="190" height="27" rx="6" fill="#0a1521" stroke="#355264"/><text x="108" y="500" fill="#bed0d4" font-family="Arial" font-size="10">WhatsApp</text><rect x="303" y="478" width="249" height="34" rx="7" fill="#67d8c7"/><text x="427" y="500" fill="#071916" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">ANALYSE MESSAGE  →</text>
<rect x="605" y="252" width="526" height="265" rx="14" fill="#111f2d" stroke="#294555"/><text x="632" y="285" fill="#8db0b9" font-family="Arial" font-size="10" letter-spacing="1.5">02 · EXPLAINABLE SIGNAL REPORT</text>
<circle cx="693" cy="376" r="58" fill="none" stroke="#2a4554" stroke-width="10"/><path d="M693 318A58 58 0 0 1 747 394" fill="none" stroke="#e9b76f" stroke-width="10" stroke-linecap="round"/><text x="693" y="380" fill="#f1f6f6" font-family="Space Grotesk,Arial" font-size="29" text-anchor="middle">58</text><text x="693" y="401" fill="#8299a5" font-family="Arial" font-size="9" text-anchor="middle">REVIEW PRIORITY</text>
<text x="775" y="344" fill="#f0c37c" font-family="Space Grotesk,Arial" font-size="18">Needs review</text><text x="775" y="370" fill="#9db0b8" font-family="Arial" font-size="11">Several surface patterns need checking.</text><text x="775" y="391" fill="#9db0b8" font-family="Arial" font-size="11">This score is not a truth probability.</text>
<rect x="632" y="434" width="464" height="53" rx="8" fill="#182d3a" stroke="#355160"/><circle cx="652" cy="460" r="5" fill="#e9b76f"/><text x="669" y="456" fill="#dce8e8" font-family="Arial" font-size="11" font-weight="700">Forwarding pressure</text><text x="669" y="474" fill="#8fa6b0" font-family="Arial" font-size="9">Check original publisher and context.</text><text x="1068" y="463" fill="#e9b76f" font-family="Arial" font-size="9" text-anchor="end">SIGNAL</text>
<rect x="68" y="541" width="1063" height="153" rx="14" fill="#10232d" stroke="#306058"/><text x="94" y="574" fill="#76dbcc" font-family="Arial" font-size="10" letter-spacing="1.5">NEXT STEP · EVIDENCE-LED CASE FILE</text><text x="94" y="608" fill="#eef7f6" font-family="Space Grotesk,Arial" font-size="22">A reviewer checks sources before recording an outcome.</text><text x="94" y="638" fill="#9cb0b8" font-family="Arial" font-size="11">Create a case → Attach primary evidence → Human review → Record a sourced conclusion</text><rect x="882" y="620" width="220" height="40" rx="8" fill="#66d8c7"/><text x="992" y="645" fill="#071816" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">CREATE CASE FILE →</text>
<text x="68" y="715" fill="#587384" font-family="Arial" font-size="9" letter-spacing="1.4">ILLUSTRATIVE SCREEN DESIGN · NOT A LIVE DATA CAPTURE</text>
</svg>