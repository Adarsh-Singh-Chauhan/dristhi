<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">DRISHTI mobile workspace concept</title><desc id="desc">Illustrative phone interface showing claim review, explainable signals, a user case file and mobile navigation.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1724"/><stop offset="1" stop-color="#07111c"/></linearGradient><linearGradient id="teal"><stop stop-color="#43b8aa"/><stop offset="1" stop-color="#8be4d3"/></linearGradient></defs><rect width="720" height="1260" rx="38" fill="#06101a"/><rect x="58" y="22" width="604" height="1216" rx="56" fill="#101e2d" stroke="#294657" stroke-width="3"/><rect x="88" y="54" width="544" height="1152" rx="32" fill="url(#bg)"/><rect x="278" y="63" width="164" height="12" rx="6" fill="#1b3141"/><text x="124" y="126" fill="#79a5b1" font-family="Arial" font-size="14" letter-spacing="3">DRISHTI / USER APP</text><rect x="124" y="151" width="46" height="46" rx="13" fill="#153d44" stroke="#59d7c4"/><path d="M137 178v-12m9 18v-24m9 18v-12" stroke="#70e3d3" stroke-width="4" stroke-linecap="round"/><text x="188" y="177" fill="#edf5f6" font-family="Arial" font-size="25" font-weight="700" letter-spacing="4">DRISHTI</text><text x="124" y="250" fill="#7e9aa8" font-family="Arial" font-size="13" letter-spacing="2">YOUR INFORMATION CHECKPOINT</text><text x="124" y="300" fill="#eef5f6" font-family="Arial" font-size="36" font-weight="700">Pause. Verify.</text><text x="124" y="342" fill="#59d7c4" font-family="Arial" font-size="36" font-weight="700">Then share.</text><text x="124" y="381" fill="#96adba" font-family="Arial" font-size="17">Review a claim before it travels further.</text><rect x="124" y="420" width="472" height="182" rx="17" fill="#14283a" stroke="#294454"/><text x="151" y="458" fill="#7f9ba7" font-family="Arial" font-size="13" letter-spacing="2">MESSAGE OR CLAIM</text><text x="151" y="497" fill="#e6eff0" font-family="Arial" font-size="19">“Urgent — forward this official</text><text x="151" y="527" fill="#e6eff0" font-family="Arial" font-size="19">alert to every group immediately…”</text><rect x="151" y="551" width="166" height="34" rx="8" fill="#174a46"/><text x="234" y="573" fill="#8be4d3" font-family="Arial" font-size="13" text-anchor="middle">Analyse message →</text><rect x="124" y="626" width="472" height="256" rx="17" fill="#122739" stroke="#315a62"/><text x="151" y="664" fill="#85a5b1" font-family="Arial" font-size="13" letter-spacing="2">EXPLAINABLE SIGNALS</text><rect x="151" y="690" width="42" height="42" rx="10" fill="#19413f"/><text x="172" y="718" fill="#75e0ce" font-family="Arial" font-size="23" text-anchor="middle">↗</text><text x="211" y="707" fill="#e8f0f0" font-family="Arial" font-size="17" font-weight="700">Forwarding pressure</text><text x="211" y="730" fill="#91aab5" font-family="Arial" font-size="13">Encourages fast redistribution</text><path d="M151 750H568" stroke="#2a4251"/><rect x="151" y="770" width="42" height="42" rx="10" fill="#493b2a"/><text x="172" y="798" fill="#f1bd69" font-family="Arial" font-size="23" text-anchor="middle">!</text><text x="211" y="787" fill="#e8f0f0" font-family="Arial" font-size="17" font-weight="700">Urgency language</text><text x="211" y="810" fill="#91aab5" font-family="Arial" font-size="13">Verify the original source</text><text x="151" y="853" fill="#f1bd69" font-family="Arial" font-size="12">Signals are not proof of falsity.</text><rect x="124" y="906" width="472" height="118" rx="16" fill="#152a3b" stroke="#2c485a"/><text x="151" y="945" fill="#80a0ac" font-family="Arial" font-size="13" letter-spacing="2">MY CASE FILE</text><text x="151" y="980" fill="#edf5f6" font-family="Arial" font-size="19" font-weight="700">DR-CASE-1042</text><rect x="425" y="957" width="137" height="35" rx="8" fill="#3e3422"/><text x="494" y="980" fill="#f1bd69" font-family="Arial" font-size="13" text-anchor="middle">Under review</text><path d="M112 1060H608" stroke="#2b4352"/><g fill="#83a0ad" font-family="Arial" font-size="12" text-anchor="middle"><text x="176" y="1100">Analyse</text><text x="300" y="1100">History</text><text x="424" y="1100">Cases</text><text x="548" y="1100">Safety</text></g><g stroke="#59d7c4" stroke-width="3" fill="none"><circle cx="176" cy="1077" r="10"/><path d="M168 1077h16m-8-8v16"/><path d="M292 1070a11 11 0 1 1-1 0m1 0v8l5 3"/><rect x="414" y="1067" width="20" height="20" rx="4"/><path d="M540 1067h16v20h-16z"/></g><rect x="304" y="1172" width="112" height="7" rx="3.5" fill="#456071"/></svg>